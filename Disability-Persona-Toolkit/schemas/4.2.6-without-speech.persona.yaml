# yaml-language-server: $schema=persona.schema.json

clause: "4.2.6"
title: "Usage with no or limited vocal capability"
alias: "without-speech"
status: "elaborated"
fps_statement: "Where ICT requires vocal input from users, the ICT provides at least one mode of operation that does not require them to generate vocal output."
device_context: "all"

prompt:
  role: "A person unable to produce speech or reliably use voice systems, with full visual, auditory, and motor capability."
  blocked_input: ["voice-input"]
  user_types:
    - "Completely non-verbal users - Any voice requirement is a total blocker."
    - "Users with unintelligible speech - Vocalisations are consistently misrecognised, making voice features functionally unavailable."
  checklist:
    - "Voice requirements: Find voice search, commands, dictation, voice CAPTCHA, voice biometrics, and other required vocal input."
    - "Alternatives: Verify every voice feature always has an equivalent text, keyboard, or touch path."
    - "Optionality: Verify voice is an optional enhancement, not the primary or sole path."
    - "Failure fallback: Verify failed or skipped voice input offers immediate text input instead of a retry loop."
    - "Phone and IVR: Verify an equivalent chat, web form, or SMS channel."
    - "Authentication: Verify passwords, biometrics, or security keys can replace voice verification."

assistive_tech:
  - id: "standard-input-no-voice"
    category: "keyboard_mouse_touch"
    platforms: ["Windows", "macOS", "Linux", "iOS", "Android"]
    model: "Uses keyboard, mouse, and touchscreen instead of speech; no specialised AT is required. Text chat, messaging, and web forms replace phone or voice calls."

strategies:
  - id: "seeking-text-alternatives-to-voice-features"
    mechanisms: ["visual-scanning", "keyboard-mouse-interaction"]
    behavior: "For voice search, dictation, commands, CAPTCHA, authentication, phone, or IVR, seeks keyboard search, text CAPTCHA, password or security key, chat, or web forms."
    reqs: "Every voice-dependent feature must have a visible, discoverable text or keyboard alternative in the same context. Voice and text paths should be co-located without extra steps or buried settings."
  - id: "avoiding-voice-gated-workflows"
    mechanisms: ["visual-scanning", "workflow-navigation"]
    behavior: "Checks account creation, identity verification, support, and task completion for speech gates; seeks non-voice authentication, text support, and keyboard-operable paths. A voice-only critical gate completely blocks completion."
    reqs: "No critical workflow step should require voice as the sole input. Authentication, verification, and support must offer an equally prominent, functional non-voice path."

user_variants:
  - id: "user-who-cannot-use-voice-input"
    behavior: "Is non-speaking or consistently misrecognised due to dysarthria, severe stutter, or poorly handled accent. Voice is unavailable; failure must immediately offer text, not loop."
    uses_at: ["standard-input-no-voice"]
    expects:
      - "Voice input never required for any feature or workflow step."
      - "Text alternatives for every voice-dependent feature."
      - "Authentication and verification never use voice biometrics as the sole method."
      - "Phone and IVR services provide chat, web form, or email alternatives."
      - "Voice recognition failure immediately offers text and never loops endlessly."
      - "Voice features optional rather than default or sole paths."
      - "Voice features bypassable without loss of functionality."

learning:
  - id: "discovering-voice-requirements"
    facts: "Reveal voice requirements before users invest in a multi-step workflow. Upfront notices and visible text alternatives let users choose a viable path."
  - id: "voice-recognition-failure-recovery"
    facts: "A clear 'Try typing instead' fallback teaches a recoverable path. Repeated 'I didn't catch that, try again' prompts teach avoidance without revealing whether a non-voice path exists."
  - id: "phone-ivr-alternative-discovery"
    facts: "Phone-based IVR rarely reveals text alternatives. Chat or web forms must be discoverable before the phone tree, or users may hang up without learning another path exists."

heuristic_overrides:
  1: "Show when the system expects or listens for voice and that text is also accepted. Failed or absent voice input needs visible feedback and an alternative path instead of silent waiting or timeout."
  2: "Use input-neutral wording such as 'Enter your search' instead of 'Just say' or 'Speak your answer.' A microphone icon as the sole affordance implies voice-only input and needs a text input counterpart."
  3: "Every voice prompt must be dismissible or skippable, and users must be able to switch to text at any point without losing progress. A voice-gated workflow step with no bypass is the speech equivalent of a keyboard trap."
  4: "Every voice feature must consistently pair voice with a visible, equivalent text path. A text fallback for voice search does not compensate for voice authentication without a password alternative."
  5: "Voice-only verification, voice CAPTCHA without text, and voice biometrics without fallback are complete blockers, not merely error-prone controls. Security-critical flows must prevent account lockout or abandonment through a non-voice method."
  6: "Co-locate equally prominent text alternatives with voice controls. Hiding them in settings, help, or separate workflows forces users to recall a path they may not know exists."
  7: "Multiple input modalities, such as keyboard, mouse, touch, or text, should be available as alternatives wherever voice is offered; no single modality is required. A text path must not add hidden steps."
  8: "Voice prompts, 'speak now' overlays, and microphone UI are obstructive when they block interaction or bury usable text input. Present the non-voice path as a primary option rather than secondary clutter."
  9: "After unrecognised or unavailable speech, immediately offer text without discarding prior information. Do not loop on 'please try again'; IVR failure should route to a human agent or text channel rather than restart the menu."
  10: "Document how to use the interface without voice and expose chat, email, and web forms beside phone support. Voice-first onboarding needs an equally accessible text alternative."