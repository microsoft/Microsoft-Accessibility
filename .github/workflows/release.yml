name: Maximize-All-Windows Release

# Builds a self-contained, single-file Windows x64 executable (no .NET install
# required by end users) and publishes it as a GitHub Release asset.
#
# To cut a release, push a tag like:
#   git tag maximize-all-windows-v1.0.0
#   git push origin maximize-all-windows-v1.0.0
#
# The built MaximizeAllWindows.exe is always also available as a workflow
# artifact (e.g. when run manually via "Run workflow").

on:
  push:
    tags:
      - 'maximize-all-windows-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish Maximize-All-Windows/src/MaximizeAllWindows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MaximizeAllWindows-win-x64
          path: |
            publish/MaximizeAllWindows.exe
            publish/README.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "publish/MaximizeAllWindows.exe" "publish/README.txt" --clobber
          } else {
            gh release create $tag "publish/MaximizeAllWindows.exe" "publish/README.txt" --title "Maximize All Windows $tag" --notes "Self-contained Windows x64 build - no .NET install required. Download MaximizeAllWindows.exe below and see the README for install steps."
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
